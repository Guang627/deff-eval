[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "passk-smooth"
version = "0.2.0"
description = "deff-eval: code and data for pilot-predicted design effects of pass@k under source-concentrated benchmarks (GSM-Symbolic, SWE-bench Verified, MATH-500)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guang Qiu" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "pydantic>=2.5",
  "tabulate>=0.9",
]

[project.optional-dependencies]
gen = ["vllm>=0.8", "datasets>=2.18", "transformers>=4.45"]
grading = ["math-verify>=0.7"]
# s3: optional, sync generation outputs to S3 (s3_uri in the generate config).
s3 = ["boto3>=1.34"]
track = ["mlflow>=2.12"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "moto[s3]>=5", "boto3>=1.34", "pandas-stubs", "types-PyYAML"]

[project.scripts]
passk = "passk_smooth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/passk_smooth"]

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E731", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: longer statistical checks"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
files = ["src/passk_smooth"]
