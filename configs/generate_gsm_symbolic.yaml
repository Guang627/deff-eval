backend: vllm
model: Qwen/Qwen2.5-Math-1.5B-Instruct
dataset: apple/GSM-Symbolic
dataset_configs: [main, p1, p2]
split: test
variants_per_template: 20
n_samples: 64
batch_problems: 100
sampling:
  temperature: 0.6
  top_p: 0.95
  max_tokens: 2048
  seed: 0
max_model_len: 4096
keep_completions: true
use_math_verify: true
output_dir: outputs/generate/gsm-symbolic
s3_uri: null
